<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>RA - Computação Gráfica</title>

    <!-- Versões compatíveis testadas para navegador móvel -->
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.js"></script>

    <style>
      body {
        margin: 0;
        overflow: hidden;
        font-family: sans-serif;
      }

      /* Painel superior com instruções */
      #hud-top {
        position: fixed;
        top: 12px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(15, 23, 42, 0.8);
        color: #f8fafc;
        padding: 8px 16px;
        border-radius: 20px;
        font-size: 13px;
        z-index: 10;
        text-align: center;
        pointer-events: none;
        width: 85%;
        max-width: 360px;
      }

      /* Botões de transformação na parte inferior */
      #hud-bottom {
        position: fixed;
        bottom: 18px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        justify-content: center;
        z-index: 10;
        width: 95%;
      }

      button {
        background: #2563eb;
        color: white;
        border: none;
        padding: 10px 14px;
        border-radius: 10px;
        font-size: 13px;
        font-weight: bold;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        cursor: pointer;
      }

      button:active {
        background: #1d4ed8;
        transform: scale(0.96);
      }

      button.secondary {
        background: #334155;
      }
    </style>
  </head>

  <body>
    <div id="hud-top">
      Aponte a câmera para o marcador <strong>HIRO</strong> na tela do PC
    </div>

    <!-- Controles interativos para a apresentação -->
    <div id="hud-bottom">
      <button onclick="alterarEscala(0.2)">+ Escala</button>
      <button onclick="alterarEscala(-0.2)">- Escala</button>
      <button onclick="alternarRotacao()">Girar: ON/OFF</button>
      <button class="secondary" onclick="trocarObjeto()">Trocar Sólido</button>
    </div>

    <!-- Cena AR.js configurada para câmera traseira do celular -->
    <a-scene
      vr-mode-ui="enabled: false"
      embedded
      renderer="logarithmicDepthBuffer: true; precision: medium;"
      arjs="sourceType: webcam; facingMode: environment; debugUIEnabled: false;"
    >
      <!-- Luzes para destacar o sombreamento 3D -->
      <a-light type="ambient" color="#ffffff" intensity="0.6"></a-light>
      <a-light type="directional" position="1 3 2" intensity="0.9"></a-light>

      <!-- Marcador Fiducial HIRO -->
      <a-marker preset="hiro" id="marcador-hiro">
        <!-- Grupo pai que recebe Escala e Rotação -->
        <a-entity
          id="grupo-objeto"
          position="0 0.6 0"
          scale="1 1 1"
          animation="property: rotation; to: 0 360 0; loop: true; dur: 5000; easing: linear"
        >
          <!-- Objeto 1: Cubo -->
          <a-box
            id="obj-cubo"
            visible="true"
            width="0.8"
            height="0.8"
            depth="0.8"
            material="color: #3b82f6; metalness: 0.2; roughness: 0.4;"
          ></a-box>

          <!-- Objeto 2: Toroide (Rosquinha) -->
          <a-torus
            id="obj-torus"
            visible="false"
            radius="0.45"
            radius-tubular="0.16"
            material="color: #10b981; metalness: 0.3; roughness: 0.3;"
          ></a-torus>

          <!-- Objeto 3: Icosaedro -->
          <a-icosahedron
            id="obj-ico"
            visible="false"
            radius="0.55"
            material="color: #f59e0b; metalness: 0.2; roughness: 0.4;"
          ></a-icosahedron>
        </a-entity>

        <!-- Base de referência no plano do marcador (eixos X e Z) -->
        <a-plane
          position="0 0.01 0"
          rotation="-90 0 0"
          width="1.2"
          height="1.2"
          material="color: #0f172a; opacity: 0.4;"
        ></a-plane>
      </a-marker>

      <a-entity camera></a-entity>
    </a-scene>

    <script>
      let escalaAtual = 1.0;
      let girando = true;
      let indiceObjeto = 0;
      const idsObjetos = ["obj-cubo", "obj-torus", "obj-ico"];

      function alterarEscala(delta) {
        escalaAtual = Math.min(2.4, Math.max(0.4, +(escalaAtual + delta).toFixed(1)));
        const grupo = document.getElementById("grupo-objeto");
        grupo.setAttribute("scale", `${escalaAtual} ${escalaAtual} ${escalaAtual}`);
      }

      function alternarRotacao() {
        const grupo = document.getElementById("grupo-objeto");
        if (girando) {
          grupo.removeAttribute("animation");
        } else {
          grupo.setAttribute(
            "animation",
            "property: rotation; to: 0 360 0; loop: true; dur: 5000; easing: linear"
          );
        }
        girando = !girando;
      }

      function trocarObjeto() {
        document.getElementById(idsObjetos[indiceObjeto]).setAttribute("visible", "false");
        indiceObjeto = (indiceObjeto + 1) % idsObjetos.length;
        document.getElementById(idsObjetos[indiceObjeto]).setAttribute("visible", "true");
      }
    </script>
  </body>
</html>
