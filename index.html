<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>RA - Modelos 3D (.GLB)</title>

    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.js"></script>

    <style>
      body {
        margin: 0;
        overflow: hidden;
        font-family: sans-serif;
      }

      #hud-top {
        position: fixed;
        top: 12px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(15, 23, 42, 0.85);
        color: #f8fafc;
        padding: 8px 16px;
        border-radius: 20px;
        font-size: 13px;
        z-index: 10;
        text-align: center;
        pointer-events: none;
        width: 85%;
        max-width: 360px;
      }

      #hud-bottom {
        position: fixed;
        bottom: 18px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        justify-content: center;
        z-index: 10;
        width: 95%;
      }

      button {
        background: #2563eb;
        color: white;
        border: none;
        padding: 10px 14px;
        border-radius: 10px;
        font-size: 13px;
        font-weight: bold;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        cursor: pointer;
      }

      button:active {
        background: #1d4ed8;
        transform: scale(0.96);
      }

      button.secondary {
        background: #334155;
      }
    </style>
  </head>

  <body>
    <div id="hud-top">
      Aponte para o marcador <strong>HIRO</strong><br />
      <span id="nome-modelo" style="color: #38bdf8; font-weight: bold;">Modelo 1: RTX</span>
    </div>

    <div id="hud-bottom">
      <button onclick="alterarEscala(0.2)">+ Escala</button>
      <button onclick="alterarEscala(-0.2)">- Escala</button>
      <button onclick="alternarRotacao()">Girar: ON/OFF</button>
      <button class="secondary" onclick="trocarObjeto()">Trocar Modelo</button>
    </div>

    <a-scene
      vr-mode-ui="enabled: false"
      embedded
      renderer="antialias: true; colorManagement: true;"
      arjs="sourceType: webcam; facingMode: environment; debugUIEnabled: false;"
    >
      <!-- Pré-carregamento dos 4 arquivos .glb (ajuste os caminhos/nomes conforme sua pasta) -->
      <a-assets>
        <a-asset-item id="asset-modelo1" src="placadevideo.glb"></a-asset-item>
        <a-asset-item id="asset-modelo2" src="jato.glb"></a-asset-item>
        <a-asset-item id="asset-modelo3" src="capivara.glb"></a-asset-item>
        <a-asset-item id="asset-modelo4" src="videogame.glb"></a-asset-item>
      </a-assets>

      <!-- Iluminação ambiente + direcionais para destacar texturas e materiais PBR dos .glb -->
      <a-light type="ambient" color="#ffffff" intensity="1.0"></a-light>
      <a-light type="directional" position="2 4 3" intensity="0.8"></a-light>
      <a-light type="directional" position="-2 -2 -3" intensity="0.4"></a-light>

      <a-marker preset="hiro" id="marcador-hiro">
        <a-entity
          id="grupo-objeto"
          position="0 0.4 0"
          scale="1 1 1"
          animation="property: rotation; to: 0 360 0; loop: true; dur: 5000; easing: linear"
        >
          <!-- Modelo 1 -->
          <a-entity
            id="obj-1"
            gltf-model="#asset-modelo1"
            visible="true"
            scale="0.5 0.5 0.5"
            position="0 0 0"
          ></a-entity>

          <!-- Modelo 2 -->
          <a-entity
            id="obj-2"
            gltf-model="#asset-modelo2"
            visible="false"
            scale="0.5 0.5 0.5"
            position="0 0 0"
          ></a-entity>

          <!-- Modelo 3 -->
          <a-entity
            id="obj-3"
            gltf-model="#asset-modelo3"
            visible="false"
            scale="0.5 0.5 0.5"
            position="0 0 0"
          ></a-entity>

          <!-- Modelo 4 -->
          <a-entity
            id="obj-4"
            gltf-model="#asset-modelo4"
            visible="false"
            scale="0.5 0.5 0.5"
            position="0 0 0"
          ></a-entity>
        </a-entity>

        <!-- Base de referência no plano do marcador -->
        <a-plane
          position="0 0.01 0"
          rotation="-90 0 0"
          width="1.2"
          height="1.2"
          material="color: #0f172a; opacity: 0.35; roughness: 1; metalness: 0;"
        ></a-plane>
      </a-marker>

      <a-entity camera></a-entity>
    </a-scene>

    <script>
      let escalaAtual = 1.0;
      let girando = true;
      let indiceObjeto = 0;

      const modelos = [
        { id: "obj-1", nome: "RTX" },
        { id: "obj-2", nome: "Jatinho de Lula" },
        { id: "obj-3", nome: "Capivara" },
        { id: "obj-4", nome: "GameBoy" }
      ];

      function alterarEscala(delta) {
        escalaAtual = Math.min(3.0, Math.max(0.2, +(escalaAtual + delta).toFixed(1)));
        const grupo = document.getElementById("grupo-objeto");
        grupo.setAttribute("scale", `${escalaAtual} ${escalaAtual} ${escalaAtual}`);
      }

      function alternarRotacao() {
        const grupo = document.getElementById("grupo-objeto");
        if (girando) {
          grupo.removeAttribute("animation");
        } else {
          grupo.setAttribute(
            "animation",
            "property: rotation; to: 0 360 0; loop: true; dur: 5000; easing: linear"
          );
        }
        girando = !girando;
      }

      function trocarObjeto() {
        document.getElementById(modelos[indiceObjeto].id).setAttribute("visible", "false");
        indiceObjeto = (indiceObjeto + 1) % modelos.length;
        document.getElementById(modelos[indiceObjeto].id).setAttribute("visible", "true");
        document.getElementById("nome-modelo").textContent = modelos[indiceObjeto].nome;
      }
    </script>
  </body>
</html>
